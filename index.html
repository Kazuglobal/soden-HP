  <style>
    /* ===== Modern Industrial Design System ===== */

    * { box-sizing: border-box; }

    ::selection {
      background: rgba(50, 55, 60, 0.2);
      color: #32373c;
    }

    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: 'Noto Sans JP', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
    }

    /* Modern scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f5f5f5; }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #32373c, #4a4f54);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #4a4f54, #32373c);
    }

    /* ===== Typography ===== */
    .font-display { font-family: 'Noto Serif JP', serif; }
    .font-body { font-family: 'Noto Sans JP', sans-serif; }
    .font-accent { font-family: 'Inter', sans-serif; }
    .font-hand { font-family: 'Caveat', cursive; }

    /* ===== Core Animations ===== */

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fade-in 0.6s ease-out forwards; }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up { animation: fade-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    @keyframes scale-in {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-scale-in { animation: scale-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    @keyframes slide-down {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-down { animation: slide-down 0.4s ease-out forwards; }

    @keyframes slide-up {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-up { animation: slide-up 0.4s ease-out forwards; }

    /* Hero Ken Burns zoom */
    @keyframes subtle-zoom {
      from { transform: scale(1.05); }
      to { transform: scale(1.12); }
    }
    .animate-subtle-zoom { animation: subtle-zoom 8s ease-out forwards; }

    /* Marquee */
    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .animate-marquee { animation: marquee 40s linear infinite; }
    .animate-marquee-reverse { animation: marquee 40s linear infinite reverse; }

    @keyframes marquee-slow {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .animate-marquee-slow { animation: marquee-slow 60s linear infinite; }

    /* Scroll indicator pulse */
    @keyframes scroll-pulse {
      0%, 100% { opacity: 1; transform: translateY(0); }
      50% { opacity: 0.5; transform: translateY(8px); }
    }
    .animate-scroll-pulse { animation: scroll-pulse 2s ease-in-out infinite; }

    /* Gradient flow */
    @keyframes gradient-flow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .animate-gradient {
      background-size: 200% 200%;
      animation: gradient-flow 5s ease infinite;
    }

    /* Line grow */
    @keyframes line-grow {
      from { width: 0; }
      to { width: 100%; }
    }
    .animate-line-grow { animation: line-grow 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    /* Float */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .animate-float { animation: float 3s ease-in-out infinite; }

    /* Shimmer */
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .animate-shimmer {
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.08) 50%, transparent 100%);
      background-size: 200% 100%;
      animation: shimmer 3s infinite;
    }

    /* Ember float */
    @keyframes ember-float {
      0% { transform: translateY(0) scale(1); opacity: 0.6; }
      50% { opacity: 0.3; }
      100% { transform: translateY(-60px) scale(0.2); opacity: 0; }
    }
    .ember { animation: ember-float 3s ease-out infinite; }

    /* Pulse glow */
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(251, 146, 60, 0.4); }
      50% { box-shadow: 0 0 20px 8px rgba(251, 146, 60, 0.15); }
    }
    .animate-pulse-glow { animation: pulse-glow 2.5s ease-in-out infinite; }

    /* Text reveal */
    @keyframes text-reveal {
      0% { clip-path: inset(0 100% 0 0); }
      100% { clip-path: inset(0 0 0 0); }
    }
    .animate-text-reveal { animation: text-reveal 1s cubic-bezier(0.77, 0, 0.175, 1) forwards; }

    /* Arc flash */
    @keyframes arc-flash {
      0%, 90%, 100% { opacity: 0; }
      92%, 98% { opacity: 1; }
      95% { opacity: 0.5; }
    }
    .arc-flash { animation: arc-flash 4s ease-in-out infinite; }

    /* Stagger delays */
    .stagger-1 { animation-delay: 0.1s; }
    .stagger-2 { animation-delay: 0.2s; }
    .stagger-3 { animation-delay: 0.3s; }
    .stagger-4 { animation-delay: 0.4s; }
    .stagger-5 { animation-delay: 0.5s; }
    .stagger-6 { animation-delay: 0.6s; }

    /* ===== Industrial Textures ===== */

    .metal-texture {
      background-image:
        repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(255,255,255,0.02) 2px, rgba(255,255,255,0.02) 4px),
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.015) 2px, rgba(255,255,255,0.015) 4px);
    }

    .weld-seam {
      height: 3px;
      background: linear-gradient(90deg, transparent 0%, #78350f 15%, #f97316 35%, #fbbf24 50%, #f97316 65%, #78350f 85%, transparent 100%);
      border-radius: 2px;
      box-shadow: 0 0 8px rgba(251, 146, 60, 0.4);
    }

    .rivet {
      width: 6px;
      height: 6px;
      background: radial-gradient(circle at 30% 30%, #71717a, #3f3f46);
      border-radius: 50%;
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.2), 0 1px 2px rgba(0,0,0,0.4);
    }

    /* ===== Component Styles ===== */

    /* Glass card */
    .glass-card {
      background: rgba(24, 24, 27, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Header glassmorphism */
    .header-glass {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
    }

    .header-scrolled .header-glass {
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 1px 0 rgba(229, 231, 235, 0.5), 0 4px 20px rgba(0,0,0,0.08);
    }

    /* Modern link underline */
    .link-underline {
      position: relative;
    }
    .link-underline::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 1.5px;
      background: linear-gradient(90deg, #f97316, #fbbf24);
      transition: width 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .link-underline:hover::after { width: 100%; }

    /* Button hover shine */
    .btn-shine {
      position: relative;
      overflow: hidden;
    }
    .btn-shine::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s ease;
    }
    .btn-shine:hover::before { left: 100%; }

    /* Card hover lift */
    .card-hover {
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease;
    }
    .card-hover:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    /* Image reveal */
    .img-reveal {
      clip-path: inset(0 100% 0 0);
      transition: clip-path 1s cubic-bezier(0.77, 0, 0.175, 1);
    }
    .img-reveal.revealed { clip-path: inset(0 0 0 0); }

    /* Number counter styling */
    .number-display {
      font-variant-numeric: tabular-nums;
      font-feature-settings: 'tnum';
    }

    /* Section divider */
    .section-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(251, 146, 60, 0.2), transparent);
    }

    /* Noise overlay */
    .noise-overlay::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0.025;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }

    /* Focus styles */
    *:focus-visible {
      outline: 2px solid #32373c;
      outline-offset: 2px;
    }

    /* Page transition */
    @keyframes page-enter {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .page-enter { animation: page-enter 0.4s ease-out forwards; }

    /* Split text helper */
    .split-char {
      display: inline-block;
      opacity: 0;
      transform: translateY(100%);
    }
    .split-char.animate {
      animation: char-reveal 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes char-reveal {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
