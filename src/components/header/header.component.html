<header #headerEl class="fixed top-0 left-0 right-0 z-50 transition-all duration-500" [class.header-scrolled]="isScrolled()">
  <!-- Main Header -->
  <div class="header-glass transition-all duration-500">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 lg:h-20">
        <!-- Logo -->
        <div class="flex-shrink-0 header-logo">
          <a routerLink="/" class="logo-container flex items-center space-x-3 group">
            <div class="relative h-8 w-8 lg:h-9 lg:w-9 flex items-center justify-center">
              <img src="/logo.png" alt="SEIKENロゴ"
                class="logo-img h-7 lg:h-8 w-auto transition-all duration-300 group-hover:scale-105" />
            </div>
            <span class="text-base lg:text-lg font-bold tracking-tight text-[#32373c] whitespace-nowrap group-hover:text-gray-700 transition-colors duration-300"
              style="font-family: 'Noto Serif JP', serif;">株式会社SEIKEN</span>
          </a>
        </div>

        <!-- Desktop Navigation -->
        <nav class="hidden lg:flex items-center gap-1">
          @for (link of navLinks; track link.label; let i = $index) {
          <a [routerLink]="link.routerLink" [fragment]="link.fragment"
            class="nav-item relative px-4 py-2 group">
            <span class="text-[13px] font-medium text-gray-600 group-hover:text-[#32373c] transition-colors duration-200 tracking-wide">{{
              link.label }}</span>
            <span
              class="absolute bottom-0 left-1/2 -translate-x-1/2 w-0 h-[2px] bg-[#32373c] transition-all duration-300 group-hover:w-6"></span>
          </a>
          }

          <!-- Contact Button -->
          <a href="#contact"
            class="ml-6 btn-shine bg-[#32373c] hover:bg-gray-800 text-white px-6 py-2.5 rounded-full text-[13px] font-bold tracking-wide transition-all duration-300 hover:shadow-[0_0_20px_rgba(50,55,60,0.3)]">
            お問い合わせ
          </a>
        </nav>

        <!-- Mobile Menu Button -->
        <div class="lg:hidden">
          <button (click)="toggleMenu()"
            class="flex items-center justify-center w-10 h-10 text-[#32373c] focus:outline-none rounded-lg hover:bg-gray-100 transition-colors">
            <svg class="h-5 w-5 transition-transform duration-300" [class.rotate-90]="isMenuOpen()" fill="none"
              viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              @if (!isMenuOpen()) {
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
              } @else {
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
              }
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Bottom accent line -->
    <div class="h-[1px] bg-gradient-to-r from-transparent via-gray-200 to-transparent"></div>
  </div>

  <!-- Mobile Menu -->
  @if (isMenuOpen()) {
  <div class="lg:hidden header-glass border-t border-gray-200 animate-slide-down">
    <div class="max-w-7xl mx-auto px-4 py-4 space-y-1">
      @for (link of navLinks; track link.label; let i = $index) {
      <a [routerLink]="link.routerLink" [fragment]="link.fragment" (click)="toggleMenu()"
        class="flex items-center justify-between px-4 py-3 rounded-lg hover:bg-gray-100 transition-all duration-200 group"
        [style.animation-delay]="i * 50 + 'ms'">
        <div class="flex items-center gap-3">
          <span class="w-1 h-4 bg-gray-300 rounded-full group-hover:bg-[#32373c] transition-colors"></span>
          <span class="text-sm font-medium text-gray-600 group-hover:text-[#32373c] transition-colors">{{ link.label }}</span>
        </div>
        <svg class="w-4 h-4 text-gray-400 group-hover:text-[#32373c] transition-all duration-200 group-hover:translate-x-0.5" fill="none"
          stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5l7 7-7 7"></path>
        </svg>
      </a>
      }
      <div class="pt-3 px-4">
        <a href="#contact" (click)="toggleMenu()"
          class="block w-full text-center bg-[#32373c] hover:bg-gray-800 text-white py-3 rounded-full text-sm font-bold tracking-wide transition-all duration-300">
          お問い合わせ
        </a>
      </div>
    </div>
  </div>
  }
</header>
