<section class="bg-zinc-900 py-16 sm:py-24 relative overflow-hidden">
  <!-- Industrial background pattern -->
  <div class="absolute inset-0 metal-texture opacity-20 pointer-events-none"></div>

  <!-- Subtle heat glow -->
  <div class="absolute top-0 right-1/4 w-64 h-64 bg-orange-600/5 rounded-full blur-3xl"></div>

  <div class="container mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
    <div class="flex flex-col lg:flex-row lg:items-start lg:gap-12">
      <!-- Title Section -->
      <div class="flex-shrink-0 mb-8 lg:mb-0">
        <h3 appGsapSplitText [splitType]="'chars'" [delay]="50" [duration]="0.5" [ease]="'power3.out'"
          [from]="{ opacity: 0, y: 20 }" [to]="{ opacity: 1, y: 0 }" [threshold]="0.3"
          class="text-3xl font-bold text-zinc-100" style="font-family: 'Noto Serif JP', serif;">お知らせ</h3>
        <div class="mt-2 w-16 h-1 bg-gradient-to-r from-orange-500 to-amber-500 shadow-[0_0_10px_rgba(251,146,60,0.5)]"></div>
      </div>

      <!-- News List -->
      <div class="flex-grow border-l-2 border-orange-500/40 pl-8">
        <div class="space-y-6">
          @for (news of newsItems; track news.date; let i = $index) {
            <article appGsapAnimate [animation]="'slideLeft'" [duration]="0.7" [delay]="0.1 * i" [distance]="40" [threshold]="0.3"
              class="group">
              <a [href]="news.href" class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4 hover:bg-zinc-800/50 -ml-4 px-4 py-3 rounded-lg transition-colors duration-300 border border-transparent hover:border-orange-500/20">
                <div class="flex items-center gap-3 flex-shrink-0">
                  <time [attr.datetime]="news.date" class="text-sm text-zinc-500 font-medium w-24">{{ news.dateFormatted }}</time>
                  <span class="text-[10px] font-bold tracking-wide text-white bg-gradient-to-r from-orange-600 to-amber-500 px-2 py-0.5 rounded shadow-[0_0_8px_rgba(251,146,60,0.3)]">{{ news.category }}</span>
                </div>
                <h4 class="text-base font-semibold text-zinc-200 group-hover:text-orange-400 transition-colors duration-300">
                  {{ news.title }}
                </h4>
              </a>
            </article>
          }
        </div>
      </div>

      <!-- View All Link -->
      <a appGsapAnimate [animation]="'fadeIn'" [duration]="0.5" [delay]="0.4" [threshold]="0.3" href="#"
        class="mt-10 lg:mt-4 lg:ml-auto text-zinc-300 font-bold hover:text-orange-400 transition duration-300 flex-shrink-0 flex items-center gap-2 group">
        <span>一覧を見る</span>
        <svg class="w-4 h-4 transform group-hover:translate-x-1 transition-transform duration-300 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
        </svg>
      </a>
    </div>
  </div>

  <!-- Bottom weld seam -->
  <div class="absolute bottom-0 left-0 right-0 h-1 weld-seam"></div>
</section>
