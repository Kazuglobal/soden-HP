<section id="news" class="py-16 sm:py-20 bg-zinc-950 relative overflow-hidden">
  <div class="section-divider absolute top-0 left-0 right-0"></div>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex flex-col lg:flex-row lg:items-start lg:gap-16">
      <!-- Title -->
      <div class="flex-shrink-0 mb-8 lg:mb-0 lg:w-48">
        <div class="flex items-center gap-3 mb-2" appGsapAnimate [animation]="'fadeUp'">
          <div class="w-5 h-[1px] bg-orange-500"></div>
          <span class="text-[10px] font-bold tracking-[0.3em] uppercase text-orange-500 font-accent">News</span>
        </div>
        <h3 class="text-2xl font-bold text-zinc-100" style="font-family: 'Noto Serif JP', serif;"
          appGsapAnimate [animation]="'fadeUp'" [delay]="0.1">お知らせ</h3>
      </div>

      <!-- News List -->
      <div class="flex-grow">
        <div class="space-y-4">
          @for (news of newsItems; track news.date; let i = $index) {
            <article appGsapAnimate [animation]="'fadeUp'" [duration]="0.6" [delay]="0.1 * i" class="group">
              <a [href]="news.href" class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-6 px-4 py-4 -mx-4 rounded-xl hover:bg-zinc-900/50 transition-colors duration-300">
                <div class="flex items-center gap-3 flex-shrink-0">
                  <time [attr.datetime]="news.date" class="text-sm text-zinc-500 font-medium font-accent tabular-nums w-24">{{ news.dateFormatted }}</time>
                  <span class="text-[10px] font-bold tracking-wide text-orange-500 bg-orange-500/10 px-2.5 py-1 rounded-full">{{ news.category }}</span>
                </div>
                <h4 class="text-sm sm:text-base font-medium text-zinc-300 group-hover:text-zinc-100 transition-colors duration-200">
                  {{ news.title }}
                </h4>
              </a>
            </article>
          }
        </div>
      </div>

      <!-- View All -->
      <a appGsapAnimate [animation]="'fadeIn'" [delay]="0.3" href="#"
        class="mt-8 lg:mt-0 text-sm text-zinc-500 hover:text-orange-400 transition-colors duration-200 flex-shrink-0 flex items-center gap-2 group">
        <span class="font-medium">一覧を見る</span>
        <svg class="w-3.5 h-3.5 transform group-hover:translate-x-0.5 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
        </svg>
      </a>
    </div>
  </div>
</section>
