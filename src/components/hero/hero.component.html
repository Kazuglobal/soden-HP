<section class="relative min-h-screen w-full overflow-hidden bg-zinc-950 text-white selection:bg-orange-500/30">
  <!-- Dynamic Background Layer -->
  <div class="absolute inset-0 z-0">
    <!-- Slideshow Images -->
    <div *ngFor="let image of heroImages; let i = index"
      class="absolute inset-0 transition-opacity duration-[2000ms] ease-in-out"
      [class.opacity-100]="currentIndex() === i" [class.opacity-0]="currentIndex() !== i">
      <div class="absolute inset-0 scale-110 sm:scale-105 md:scale-105"
        [class.animate-subtle-zoom]="currentIndex() === i">
        <img [src]="image" alt="SEIKEN 現場"
          class="w-full h-full object-cover object-[70%_top] sm:object-[center_top] md:object-center">
      </div>
    </div>
    <!-- Dark industrial overlay with orange heat gradient -->
    <div class="absolute inset-0 bg-gradient-to-r from-zinc-950/90 via-zinc-950/60 to-zinc-950/40"></div>
    <div class="absolute inset-0 bg-gradient-to-b from-zinc-950/50 via-transparent to-zinc-950/80"></div>
    <!-- Heat glow from bottom -->
    <div class="absolute inset-0 bg-gradient-to-t from-orange-900/20 via-transparent to-transparent"></div>

    <!-- Welding Sparks Overlay -->
    <div class="absolute inset-0 pointer-events-none overflow-hidden">
      <!-- Animated spark particles -->
      <div class="absolute bottom-1/4 left-1/4 w-2 h-2 bg-orange-400 rounded-full animate-ping opacity-60" style="animation-delay: 0s;"></div>
      <div class="absolute bottom-1/3 left-1/3 w-1 h-1 bg-yellow-300 rounded-full animate-ping opacity-80" style="animation-delay: 0.3s;"></div>
      <div class="absolute bottom-1/4 right-1/3 w-2 h-2 bg-orange-500 rounded-full animate-ping opacity-50" style="animation-delay: 0.6s;"></div>
      <div class="absolute top-1/2 left-1/2 w-1 h-1 bg-amber-400 rounded-full animate-ping opacity-70" style="animation-delay: 0.9s;"></div>
    </div>

    <!-- Industrial Grid Pattern -->
    <div class="absolute inset-0 opacity-10 pointer-events-none">
      <svg class="w-full h-full" overflow="visible">
        <defs>
          <pattern id="hero-grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
            <rect x="0" y="0" width="60" height="60" fill="none" stroke="#f97316" stroke-width="0.5" opacity="0.3"/>
            <circle cx="0" cy="0" r="2" fill="#f97316" opacity="0.4"/>
            <circle cx="60" cy="0" r="2" fill="#f97316" opacity="0.4"/>
            <circle cx="0" cy="60" r="2" fill="#f97316" opacity="0.4"/>
            <circle cx="60" cy="60" r="2" fill="#f97316" opacity="0.4"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#hero-grid)" />
      </svg>
    </div>

    <!-- Metal texture overlay -->
    <div class="absolute inset-0 metal-texture opacity-30"></div>
  </div>

  <!-- Top Ribbon Accent - Welding Orange Theme -->
  <div class="absolute top-0 left-0 z-30 h-10 md:h-12 flex items-center px-6 md:px-16 lg:px-24">
    <div
      class="absolute inset-0 bg-gradient-to-r from-orange-600 via-amber-500 to-transparent opacity-95 -skew-x-[15deg] origin-left scale-x-125">
    </div>
    <!-- Heat glow effect -->
    <div class="absolute inset-0 bg-gradient-to-r from-orange-500/50 to-transparent blur-sm -skew-x-[15deg] origin-left scale-x-125"></div>
    <div class="relative z-10 flex items-center space-x-4">
      <h4 class="font-['Dancing_Script'] text-xl md:text-3xl lg:text-4xl text-white tracking-wider drop-shadow-[0_0_10px_rgba(251,146,60,0.5)]" appGsapAnimate
        [animation]="'fadeRight'" [duration]="1.2">
        Welding Professionals
      </h4>
    </div>
  </div>

  <!-- Welding Arc Flash Effect (decorative) -->
  <div class="absolute top-1/3 left-1/4 w-32 h-32 rounded-full bg-orange-400/20 blur-3xl arc-flash pointer-events-none"></div>
  <div class="absolute bottom-1/4 right-1/4 w-24 h-24 rounded-full bg-amber-500/15 blur-2xl arc-flash pointer-events-none" style="animation-delay: 1.5s;"></div>

  <!-- Main Content -->
  <div
    class="relative z-10 flex flex-col h-full px-4 sm:px-6 md:px-16 lg:px-24 pt-32 sm:pt-24 md:pt-20 lg:pt-24 pb-16 md:pb-20 lg:pb-24">
    <div class="flex-1 flex items-center">
      <div class="max-w-4xl lg:max-w-5xl">

        <!-- Decorative Branding Text -->
        <div class="mb-4 md:mb-10" appGsapAnimate [animation]="'fadeRight'" [duration]="1.2" [delay]="0.2">
          <h3 class="font-['Playball'] text-2xl sm:text-2xl md:text-5xl lg:text-6xl text-orange-100/90 leading-tight drop-shadow-[0_0_20px_rgba(251,146,60,0.3)]">
            Steel Craftsmen
          </h3>
          <div
            class="mt-3 md:mt-4 inline-flex items-center bg-zinc-900/60 backdrop-blur-md border border-orange-500/30 px-4 md:px-6 py-2 rounded-sm shadow-[0_0_15px_rgba(251,146,60,0.2)]">
            <div class="w-6 md:w-8 h-px bg-gradient-to-r from-orange-500 to-amber-400 mr-3"></div>
            <span
              class="text-[9px] md:text-[11px] font-black tracking-[0.3em] md:tracking-[0.4em] uppercase text-orange-200">
              溶接工事のプロフェッショナル集団
            </span>
          </div>
        </div>

        <!-- High-Impact Motto -->
        <h1 class="text-3xl sm:text-3xl md:text-6xl lg:text-7xl xl:text-8xl font-black leading-[1.1] tracking-tight"
          style="font-family: 'Noto Serif JP', serif;">
          <div class="overflow-hidden mb-2 md:mb-4">
            <span class="block bg-gradient-to-r from-white via-orange-100 to-amber-200 bg-clip-text text-transparent drop-shadow-[0_2px_10px_rgba(251,146,60,0.3)]" appGsapAnimate [animation]="'fadeUp'" [duration]="1.2" [delay]="0.5">
              確かな技術で
            </span>
          </div>
          <div class="overflow-hidden">
            <span class="block bg-gradient-to-r from-orange-200 via-white to-orange-100 bg-clip-text text-transparent" appGsapAnimate [animation]="'fadeUp'" [duration]="1.2" [delay]="0.7">
              鉄鋼の加工を行っております
            </span>
          </div>
        </h1>

        <!-- Core Narrative -->
        <div class="mt-6 md:mt-12 max-w-xl lg:max-w-2xl" appGsapAnimate [animation]="'fadeUp'" [duration]="1"
          [delay]="1">
          <div class="flex items-start md:bg-zinc-900/70 md:backdrop-blur-sm md:rounded-lg md:p-6 lg:p-8 md:border md:border-orange-500/20 md:shadow-[0_0_30px_rgba(251,146,60,0.1)]">
            <div
              class="w-1 md:w-1.5 lg:w-2 bg-gradient-to-b from-orange-500 via-amber-400 to-orange-600 h-12 md:h-20 mr-4 md:mr-8 shadow-[0_0_20px_rgba(251,146,60,0.6)] rounded-full flex-shrink-0">
            </div>
            <div>
              <h2 class="text-2xl sm:text-3xl md:text-4xl font-black text-white leading-snug mb-3 md:mb-8 relative"
                style="font-family: 'Noto Serif JP', serif;" appGsapAnimate [animation]="'fadeUp'" [delay]="0.4">
                <span class="relative z-10 text-lg sm:text-2xl md:text-3xl text-orange-100">「鉄鋼のプロフェッショナル」</span>
                <!-- Title Decoration - Welding spark -->
                <div class="absolute -left-4 top-1/2 -translate-y-1/2 w-1.5 h-8 bg-gradient-to-b from-orange-400 to-amber-500 rounded-full opacity-70 shadow-[0_0_10px_rgba(251,146,60,0.8)]">
                </div>
              </h2>
              <p
                class="text-xs sm:text-sm md:text-base leading-relaxed md:leading-loose lg:leading-loose text-zinc-300">
                幅広い溶接工事に携わってきた実績を活かして日々新しい技術を取り入れております。お客様のご要望に応じて鉄やステンレスなど幅広い資材の加工を行っております。
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Scroll Indicator - Welding theme -->
  <div class="absolute bottom-8 md:bottom-12 left-6 md:left-16 lg:left-24 z-20 flex flex-col items-center select-none"
    appGsapAnimate [animation]="'fadeUp'" [delay]="1.5">
    <div class="relative w-6 h-10 border-2 border-orange-500/40 rounded-full flex justify-center pt-2 overflow-hidden shadow-[0_0_10px_rgba(251,146,60,0.3)]">
      <div class="w-1 h-2 bg-gradient-to-b from-orange-400 to-amber-500 rounded-full animate-bounce shadow-[0_0_8px_rgba(251,146,60,0.8)]"></div>
    </div>
    <span class="mt-3 text-[8px] md:text-[9px] font-black tracking-[0.3em] uppercase text-orange-400/60">Scroll</span>
  </div>

  <!-- Bottom Welding Seam Decoration -->
  <div class="absolute bottom-0 left-0 right-0 h-1 weld-seam z-20"></div>

  <!-- Right Edge Vertical Text -->
  <div class="absolute right-4 md:right-8 top-1/2 -translate-y-1/2 z-20 hidden md:block transform rotate-180"
    style="writing-mode: vertical-rl;">
    <span class="text-[10px] font-black tracking-[0.5em] text-orange-500/30 uppercase">
      © 2026 SEIKEN
    </span>
  </div>

  <!-- Corner Rivets (Industrial decoration) -->
  <div class="absolute top-4 left-4 rivet hidden md:block"></div>
  <div class="absolute top-4 right-4 rivet hidden md:block"></div>
  <div class="absolute bottom-4 left-4 rivet hidden md:block"></div>
  <div class="absolute bottom-4 right-4 rivet hidden md:block"></div>
</section>
