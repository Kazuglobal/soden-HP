<section class="relative h-screen w-full overflow-hidden bg-zinc-950 text-white">
  <!-- Dynamic Background -->
  <div class="absolute inset-0 z-0">
    <div *ngFor="let image of heroImages; let i = index"
      class="absolute inset-0 transition-opacity duration-[1500ms] ease-in-out"
      [class.opacity-100]="currentIndex() === i" [class.opacity-0]="currentIndex() !== i">
      <div class="absolute inset-0 scale-105"
        [class.animate-subtle-zoom]="currentIndex() === i">
        <img [src]="image" alt="SEIKEN 現場"
          class="w-full h-full object-cover object-[70%_top] sm:object-center">
      </div>
    </div>
    <div class="absolute inset-0 bg-gradient-to-r from-zinc-950/95 via-zinc-950/60 to-zinc-950/30"></div>
    <div class="absolute inset-0 bg-gradient-to-b from-zinc-950/30 via-transparent to-zinc-950"></div>
  </div>

  <!-- Main Content -->
  <div class="relative z-10 flex flex-col justify-end h-full px-6 sm:px-8 md:px-16 lg:px-24 pb-24 md:pb-32">
    <div class="max-w-5xl">

      <!-- Accent label -->
      <div class="mb-6 md:mb-8" appGsapAnimate [animation]="'fadeUp'" [duration]="0.8" [delay]="0.3">
        <div class="inline-flex items-center gap-3">
          <div class="w-8 h-[1px] bg-orange-500"></div>
          <span class="text-[11px] font-bold tracking-[0.3em] uppercase text-orange-400">
            Welding Professionals
          </span>
        </div>
      </div>

      <!-- Main heading -->
      <h1 class="text-[clamp(2.5rem,7vw,6rem)] font-black leading-[1.05] tracking-tight"
        style="font-family: 'Noto Serif JP', serif;">
        <div class="overflow-hidden mb-1 md:mb-2">
          <span class="block text-white" appGsapAnimate [animation]="'fadeUp'" [duration]="1" [delay]="0.5">
            確かな技術で
          </span>
        </div>
        <div class="overflow-hidden">
          <span class="block bg-gradient-to-r from-orange-300 via-amber-200 to-orange-400 bg-clip-text text-transparent" appGsapAnimate [animation]="'fadeUp'" [duration]="1" [delay]="0.7">
            鉄鋼の未来を創る
          </span>
        </div>
      </h1>

      <!-- Description -->
      <p class="mt-6 md:mt-8 text-sm md:text-base text-zinc-400 max-w-lg leading-relaxed" appGsapAnimate [animation]="'fadeUp'" [duration]="0.8" [delay]="1">
        横浜を拠点に、アーク溶接・半自動溶接・Tig溶接など<br class="hidden sm:inline">
        幅広い鉄鋼加工を行うプロフェッショナル集団です。
      </p>

      <!-- CTA buttons -->
      <div class="mt-8 md:mt-10 flex flex-wrap gap-4" appGsapAnimate [animation]="'fadeUp'" [duration]="0.8" [delay]="1.2">
        <a href="#what-we-do"
          class="btn-shine inline-flex items-center gap-2 bg-orange-500 hover:bg-orange-400 text-white px-8 py-3.5 rounded-full text-sm font-bold tracking-wide transition-all duration-300 hover:shadow-[0_0_24px_rgba(251,146,60,0.4)]">
          <span>事業内容を見る</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path>
          </svg>
        </a>
        <a href="#contact"
          class="inline-flex items-center gap-2 border border-zinc-600 hover:border-zinc-400 text-zinc-300 hover:text-white px-8 py-3.5 rounded-full text-sm font-bold tracking-wide transition-all duration-300">
          <span>お問い合わせ</span>
        </a>
      </div>
    </div>
  </div>

  <!-- Scroll Indicator -->
  <div class="absolute bottom-8 left-1/2 -translate-x-1/2 z-20 flex flex-col items-center"
    appGsapAnimate [animation]="'fadeUp'" [delay]="1.8">
    <div class="w-[1px] h-12 bg-gradient-to-b from-transparent via-orange-500/50 to-orange-500 animate-scroll-pulse"></div>
    <span class="mt-2 text-[9px] font-bold tracking-[0.4em] uppercase text-zinc-500">Scroll</span>
  </div>

  <!-- Side text -->
  <div class="absolute right-6 md:right-8 top-1/2 -translate-y-1/2 z-10 hidden lg:block transform rotate-180"
    style="writing-mode: vertical-rl;">
    <span class="text-[10px] font-medium tracking-[0.5em] text-zinc-600 uppercase">
      SEIKEN 2026
    </span>
  </div>
</section>
