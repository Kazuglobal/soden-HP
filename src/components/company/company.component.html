<section id="company" class="relative overflow-hidden">
  <!-- Hero Photo Section -->
  <div class="relative min-h-[50vh] md:min-h-[60vh] flex items-end">
    <div class="absolute inset-0 z-0">
      <img src="https://images.unsplash.com/photo-1504307651254-35680f356dfd?w=1600&q=80" alt="SEIKENチーム" class="w-full h-full object-cover">
      <div class="absolute inset-0 bg-gradient-to-t from-white via-white/60 to-white/20"></div>
    </div>

    <div class="relative z-10 max-w-7xl mx-auto w-full px-6 sm:px-8 lg:px-8 pb-12 md:pb-16">
      <div class="flex items-center gap-3 mb-4" appGsapAnimate [animation]="'fadeUp'">
        <div class="w-8 h-[1px] bg-[#32373c]"></div>
        <span class="text-[10px] font-bold tracking-[0.3em] uppercase text-[#32373c]">Company</span>
      </div>
      <h2 class="text-4xl md:text-5xl lg:text-6xl font-black text-[#32373c] tracking-tight mb-4"
        style="font-family: 'Noto Serif JP', serif;" appGsapAnimate [animation]="'fadeUp'" [delay]="0.1">
        会社概要
      </h2>
      <p class="text-gray-600 text-sm md:text-base max-w-md mb-8" appGsapAnimate [animation]="'fadeUp'" [delay]="0.2">
        横浜を拠点に、確かな技術と信頼で鉄鋼加工を行っています。
      </p>
      <a routerLink="/company" appGsapAnimate [animation]="'fadeUp'" [delay]="0.3"
        class="inline-flex items-center gap-2 btn-shine bg-[#32373c] hover:bg-[#32373c]/90 text-white px-8 py-3.5 rounded-full text-sm font-bold tracking-wide transition-all duration-300 hover:shadow-[0_0_24px_rgba(50,55,60,0.4)]">
        <span>詳しく見る</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path>
        </svg>
      </a>
    </div>
  </div>
</section>
